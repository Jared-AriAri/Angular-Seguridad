<div class="auth">
  <p-card header="Register">
    <div class="p-fluid">
      <div class="field">
        <label>Nombre</label>
        <input pInputText type="text" />
      </div>

      <div class="field">
        <label>Email</label>
        <input pInputText type="email" />
      </div>

      <div class="field">
        <label>Contraseña</label>
        <input pInputText type="password" />
      </div>

      <button pButton label="Crear cuenta" icon="pi pi-user-plus" severity="success"></button>

      <div style="margin-top:12px">
        <a routerLink="/login">Ya tengo cuenta → Login</a>
      </div>
    </div>
  </p-card>
</div>
