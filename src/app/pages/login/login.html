<div class="auth">
  <p-card header="Login">
    <div class="p-fluid">
      <div class="field">
        <label>Email</label>
        <input pInputText type="email" placeholder="correo@ejemplo.com" />
      </div>

      <div class="field">
        <label>Contraseña</label>
        <input pInputText type="password" placeholder="••••••••" />
      </div>

      <button pButton label="Entrar" icon="pi pi-check" class="w-full"></button>

      <div style="margin-top:12px">
        <a routerLink="/register">No tengo cuenta → Registrarme</a>
      </div>
    </div>
  </p-card>
</div>
