<p-card [style]="{ width: '520px', maxWidth: '94vw' }" styleClass="auth-card auth-card--premium">
  <ng-template pTemplate="header">
    <div class="auth-head">
      <div class="auth-header-top">
        <button
          pButton
          type="button"
          icon="pi pi-arrow-left"
          class="p-button-text auth-back-btn"
          routerLink="/"
        ></button>

        <div class="auth-badges">
          <div class="badge" style="background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 100%);">
            <i class="pi pi-bolt"></i>
            <span>LLM Model: Antigravity</span>
          </div>
          <div class="badge badge--soft">
            <i class="pi pi-lock"></i>
            <span>Sesión protegida</span>
          </div>
        </div>
      </div>

      <div class="auth-title">Iniciar sesión</div>
      <div class="auth-subtitle">Ingresa tus datos para continuar</div>
    </div>
  </ng-template>

  <div class="auth-body">
    <div class="p-fluid formgrid grid">
      <div class="field col-12">
        <label for="email">Email</label>
        <span class="p-input-icon-left w-full auth-input">
          <i class="pi pi-envelope"></i>
          <input
            id="email"
            pInputText
            type="email"
            class="w-full"
            [(ngModel)]="email"
            placeholder="correo@ejemplo.com"
            autocomplete="email"
          />
        </span>
      </div>

      <div class="field col-12">
        <label for="password">Contraseña</label>
        <p-password
          id="password"
          styleClass="w-full auth-input auth-password"
          inputStyleClass="w-full"
          [(ngModel)]="pass"
          [feedback]="false"
          [toggleMask]="true"
          placeholder="Tu contraseña"
          [autocomplete]="'current-password'"
        ></p-password>
      </div>

      <div class="col-12 auth-actions">
        <button
          pButton
          type="button"
          label="Entrar"
          icon="pi pi-sign-in"
          class="w-full auth-cta auth-cta--premium"
          (click)="login()"
        ></button>
      </div>

      <div class="col-12" *ngIf="error">
        <p-message severity="error" [text]="error"></p-message>
      </div>

      <div class="col-12" *ngIf="success">
        <p-message severity="success" [text]="success"></p-message>
      </div>

      <div class="col-12">
        <div class="auth-footer">
          <div class="auth-footer__left">
            <span class="muted">¿No tienes cuenta?</span>
            <a routerLink="/register" class="auth-link">Crear cuenta</a>
          </div>
          <div class="auth-footer__right">
            <i class="pi pi-lock"></i>
            <span>Protegemos tus datos</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</p-card>
