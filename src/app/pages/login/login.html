<p-toast></p-toast>

<p-card [style]="{ width: '520px', maxWidth: '94vw' }" styleClass="auth-card auth-card--premium">
  <ng-template pTemplate="header">
    <div class="auth-head">
      <div class="auth-header-top">
        <button pButton type="button" icon="pi pi-arrow-left" class="p-button-text auth-back-btn"
          routerLink="/"></button>

        <div class="auth-badges">
          <div class="badge" style="background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 100%);">
            <i class="pi pi-bolt"></i>
            <span>Sistema ERP</span>
          </div>
          <div class="badge badge--soft">
            <i class="pi pi-lock"></i>
            <span>Sesión protegida</span>
          </div>
        </div>
      </div>

      <div class="auth-title">Iniciar sesión</div>
      <div class="auth-subtitle">Ingresa tus credenciales para continuar</div>
    </div>
  </ng-template>

  <div class="auth-body">
    <div class="p-fluid formgrid grid">
      <div class="field col-12">
        <label for="email">Email</label>
        <div class="p-inputgroup auth-input">
          <span class="p-inputgroup-addon">
            <i class="pi pi-envelope"></i>
          </span>
          <input id="email" pInputText type="email" [(ngModel)]="email" placeholder="correo@ejemplo.com"
            autocomplete="email" [disabled]="loading" />
        </div>
      </div>

      <div class="field col-12">
        <label for="password">Contraseña</label>
        <p-password id="password" styleClass="w-full auth-input auth-password" inputStyleClass="w-full"
          [(ngModel)]="pass" [feedback]="false" [toggleMask]="true" placeholder="Tu contraseña"
          [autocomplete]="'current-password'" [disabled]="loading" (keyup.enter)="login()"></p-password>
      </div>

      <div class="col-12 auth-actions mt-3">
        <button pButton type="button" label="Entrar" icon="pi pi-sign-in" class="w-full auth-cta auth-cta--premium"
          (click)="login()" [loading]="loading"></button>
      </div>

      <div class="col-12 mt-4">
        <div class="auth-footer flex justify-content-between align-items-center">
          <div class="auth-footer__left">
            <span class="text-500 mr-2">¿No tienes cuenta?</span>
            <a routerLink="/register" class="font-bold text-primary text-decoration-none">Crear cuenta</a>
          </div>
          <div class="auth-footer__right text-500 text-sm flex align-items-center gap-2">
            <i class="pi pi-lock"></i>
            <span>Protegemos tus datos</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</p-card>
