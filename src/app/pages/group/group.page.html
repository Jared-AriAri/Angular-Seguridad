<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<p-card *ngIf="hasPermission('group:view')" styleClass="auth-card auth-card--premium"
  [style]="{ width: '1000px', maxWidth: '96vw' }">
  <ng-template pTemplate="header">
    <div class="auth-head">
      <div class="auth-title">Grupos</div>
      <div class="auth-subtitle">Gestión centralizada de equipos y departamentos</div>
    </div>
  </ng-template>

  <div class="auth-body">
    <p-toolbar styleClass="mb-3">
      <ng-template pTemplate="start">
        <button *ngIf="hasPermission('group:create')" pButton type="button" icon="pi pi-plus" label="Nuevo Grupo"
          class="p-button-success" (click)="openCreate()"></button>
      </ng-template>

      <ng-template pTemplate="end">
        <span class="p-input-icon-left w-full auth-input" style="max-width: 320px;">
          <i class="pi pi-search"></i>
          <input pInputText type="text" class="w-full" (input)="dt.filterGlobal($any($event.target).value, 'contains')"
            placeholder="Buscar por nombre..." />
        </span>
      </ng-template>
    </p-toolbar>

    <div class="mt-2">
      <p-table #dt [value]="groups" [loading]="loading" [paginator]="true" [rows]="10"
        [globalFilterFields]="['nombre', 'descripcion']" styleClass="p-datatable-sm">

        <ng-template pTemplate="header">
          <tr>
            <th style="width: 30%;">Nombre</th>
            <th>Descripción</th>
            <th style="width: 120px;">Estado</th>
            <th style="width: 220px; text-align: right;">Acciones</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-g>
          <tr>
            <td>
              <div class="font-bold text-lg" style="color: var(--primary-color);">{{ g.nombre }}</div>
              <div class="text-xs opacity-60">
                Creado: {{ g.creado_en | date: "mediumDate" }}
              </div>
            </td>
            <td class="text-sm">{{ g.descripcion || "Sin descripción disponible" }}</td>
            <td>
              <p-tag [value]="g.estado === 'inactivo' ? 'Inactivo' : 'Activo'"
                [severity]="g.estado === 'inactivo' ? 'secondary' : 'success'"></p-tag>
            </td>
            <td style="text-align: right; white-space: nowrap;">
              <button pButton type="button" icon="pi pi-external-link" class="p-button-text p-button-rounded"
                (click)="openGroup(g)" pTooltip="Abrir Panel"></button>

              <button pButton type="button" icon="pi pi-users" class="p-button-text p-button-rounded p-button-help"
                (click)="openMembers(g.id)" pTooltip="Miembros"></button>

              <button *ngIf="hasPermission('group:edit')" pButton type="button" icon="pi pi-pencil"
                class="p-button-text p-button-rounded" (click)="openEdit(g)" pTooltip="Editar"></button>

              <button *ngIf="hasPermission('group:delete')" pButton type="button" icon="pi pi-trash"
                class="p-button-text p-button-danger p-button-rounded" (click)="askDelete(g)"
                pTooltip="Eliminar"></button>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</p-card>

<p-dialog [(visible)]="dialogOpen" [modal]="true" [style]="{ width: '450px' }" header="Detalles del Grupo">
  <div class="p-fluid">
    <div class="field">
      <label class="font-bold">Nombre</label>
      <input pInputText [(ngModel)]="form.nombre" />
    </div>
    <div class="field mt-3">
      <label class="font-bold">Descripción</label>
      <textarea pInputTextarea [(ngModel)]="form.descripcion" rows="3"></textarea>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <button pButton label="Cancelar" class="p-button-text" (click)="dialogOpen = false"></button>
    <button pButton label="Guardar" icon="pi pi-save" (click)="save()"></button>
  </ng-template>
</p-dialog>

<app-group-members-modal [visible]="memberModalVisible" [groupId]="selectedGroupIdForMembers"
  (closeModal)="memberModalVisible = false">
</app-group-members-modal>
