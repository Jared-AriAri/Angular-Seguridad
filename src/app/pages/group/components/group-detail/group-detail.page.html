<p-card *ngIf="hasPermission('group:view')" styleClass="group-page-card" [style]="{ width: '100%', maxWidth: '100%' }">
  <ng-template pTemplate="header">
    <div class="group-page-header">
      <div>
        <div class="group-page-title">{{ group?.nombre || "Grupo" }}</div>
        <div class="group-page-subtitle">
          {{ group?.descripcion || "Vista de tickets del grupo" }}
        </div>
      </div>

      <div class="group-page-actions">
        <div class="dashboard-badge"
          style="background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 100%); color: white; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 6px;">
          <i class="pi pi-bolt"></i> Sistema ERP
        </div>

        <p-selectButton *ngIf="hasPermission('ticket:view')" [options]="viewOptions" [(ngModel)]="viewMode"
          optionLabel="label" optionValue="value"></p-selectButton>

        <button *ngIf="hasPermission('group:manage')" pButton type="button" label="Miembros" severity="secondary"
          (click)="openMembersModal()"></button>

        <button *ngIf="hasPermission('ticket:create')" pButton type="button" label="Crear ticket"
          (click)="openCreateTicket()"></button>

        <button pButton type="button" label="Volver" severity="contrast" (click)="backToGroups()"></button>
      </div>
    </div>
  </ng-template>

  <div class="group-page-content" *ngIf="hasPermission('ticket:view'); else noTicketPermission">
    <div class="dashboard-summary"
      style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
      <p-card [style]="{ background: '#f8fafc', border: '1px solid #e2e8f0', boxShadow: 'none' }">
        <div style="color: #64748b; font-size: 0.9rem; font-weight: 600;">Total Tickets</div>
        <div style="font-size: 2rem; font-weight: 800; color: #0f172a;">{{ totalTickets }}</div>
      </p-card>
      <p-card [style]="{ background: '#fffbeb', border: '1px solid #fde68a', boxShadow: 'none' }">
        <div style="color: #d97706; font-size: 0.9rem; font-weight: 600;">Pendientes</div>
        <div style="font-size: 2rem; font-weight: 800; color: #d97706;">{{ pendingTickets }}</div>
      </p-card>
      <p-card [style]="{ background: '#f0fdf4', border: '1px solid #bbf7d0', boxShadow: 'none' }">
        <div style="color: #16a34a; font-size: 0.9rem; font-weight: 600;">Completados</div>
        <div style="font-size: 2rem; font-weight: 800; color: #16a34a;">{{ completedTickets }}</div>
      </p-card>
    </div>

    <div class="dashboard-filters" style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
      <button pButton type="button" label="Todos"
        [class]="currentFilter === 'all' ? 'p-button-primary' : 'p-button-outlined'"
        (click)="applyFilter('all')"></button>
      <button pButton type="button" label="Mis tickets"
        [class]="currentFilter === 'mine' ? 'p-button-primary' : 'p-button-outlined'"
        (click)="applyFilter('mine')"></button>
      <button pButton type="button" label="Sin asignar"
        [class]="currentFilter === 'unassigned' ? 'p-button-primary' : 'p-button-outlined'"
        (click)="applyFilter('unassigned')"></button>
      <button pButton type="button" label="Prioridad Alta"
        [class]="currentFilter === 'high_priority' ? 'p-button-primary' : 'p-button-outlined'"
        (click)="applyFilter('high_priority')"></button>
    </div>

    <app-ticket-kanban *ngIf="viewMode === 'kanban'" [tickets]="filteredTickets"
      (statusChange)="onTicketStatusChange($event)" (ticketClick)="openTicketDetail($event)"></app-ticket-kanban>

    <app-ticket-list *ngIf="viewMode === 'list'" [tickets]="filteredTickets"
      (ticketClick)="openTicketDetail($event)"></app-ticket-list>
  </div>

  <ng-template #noTicketPermission>
    <div class="dashboard-empty-state">
      No tienes permiso para ver los tickets de este grupo.
    </div>
  </ng-template>
</p-card>

<app-create-ticket-modal *ngIf="hasPermission('ticket:create')" [visible]="showCreateModal" [groupId]="group?.id || ''"
  (closeModal)="closeCreateTicket()"></app-create-ticket-modal>

<app-ticket-detail-modal *ngIf="hasPermission('ticket:view')" [visible]="showDetailModal" [ticket]="selectedTicket"
  [canEdit]="selectedTicket ? canEditTicket(selectedTicket) : false"
  (closeModal)="closeTicketDetail()"></app-ticket-detail-modal>

<app-group-members-modal *ngIf="hasPermission('group:manage')" [visible]="showMembersModal" [groupId]="group?.id || ''"
  (closeModal)="closeMembersModal()"></app-group-members-modal>
