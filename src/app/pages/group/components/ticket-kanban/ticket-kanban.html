<div class="ticket-kanban-board" cdkDropListGroup>
  <div class="ticket-kanban-column">
    <div class="ticket-kanban-column-title">Pendiente</div>
    <div cdkDropList [cdkDropListData]="pending" (cdkDropListDropped)="drop($event, 'pendiente')" class="ticket-kanban-stack">
      <p-card *ngFor="let ticket of pending" cdkDrag styleClass="ticket-card" (click)="onTicketClick(ticket)" [style]="{'cursor': 'pointer'}">
        <div class="ticket-card-title">{{ ticket.title }}</div>
        <div class="ticket-card-text">{{ ticket.description }}</div>
        <div class="ticket-card-footer">
          <p-tag [value]="ticket.priority" severity="warn"></p-tag>
        </div>
      </p-card>
    </div>
  </div>

  <div class="ticket-kanban-column">
    <div class="ticket-kanban-column-title">En progreso</div>
    <div cdkDropList [cdkDropListData]="inProgress" (cdkDropListDropped)="drop($event, 'en_progreso')" class="ticket-kanban-stack">
      <p-card *ngFor="let ticket of inProgress" cdkDrag styleClass="ticket-card" (click)="onTicketClick(ticket)" [style]="{'cursor': 'pointer'}">
        <div class="ticket-card-title">{{ ticket.title }}</div>
        <div class="ticket-card-text">{{ ticket.description }}</div>
        <div class="ticket-card-footer">
          <p-tag [value]="ticket.priority" severity="info"></p-tag>
        </div>
      </p-card>
    </div>
  </div>

  <div class="ticket-kanban-column">
    <div class="ticket-kanban-column-title">Revisión</div>
    <div cdkDropList [cdkDropListData]="review" (cdkDropListDropped)="drop($event, 'revision')" class="ticket-kanban-stack">
      <p-card *ngFor="let ticket of review" cdkDrag styleClass="ticket-card" (click)="onTicketClick(ticket)" [style]="{'cursor': 'pointer'}">
        <div class="ticket-card-title">{{ ticket.title }}</div>
        <div class="ticket-card-text">{{ ticket.description }}</div>
        <div class="ticket-card-footer">
          <p-tag [value]="ticket.priority" severity="contrast"></p-tag>
        </div>
      </p-card>
    </div>
  </div>

  <div class="ticket-kanban-column">
    <div class="ticket-kanban-column-title">Finalizado</div>
    <div cdkDropList [cdkDropListData]="done" (cdkDropListDropped)="drop($event, 'finalizado')" class="ticket-kanban-stack">
      <p-card *ngFor="let ticket of done" cdkDrag styleClass="ticket-card" (click)="onTicketClick(ticket)" [style]="{'cursor': 'pointer'}">
        <div class="ticket-card-title">{{ ticket.title }}</div>
        <div class="ticket-card-text">{{ ticket.description }}</div>
        <div class="ticket-card-footer">
          <p-tag [value]="ticket.priority" severity="success"></p-tag>
        </div>
      </p-card>
    </div>
  </div>
</div>
