<p-dialog header="Crear ticket" [(visible)]="visible" [modal]="true" [closable]="true" [dismissableMask]="true"
  [draggable]="false" [resizable]="false" [style]="{ width: '640px', maxWidth: '96vw' }" (onHide)="close()">
  <div class="ticket-modal-form">
    <div class="field">
      <label for="title">Título</label>
      <input id="title" pInputText [(ngModel)]="form.title" />
    </div>

    <div class="field">
      <label for="description">Descripción</label>
      <textarea id="description" pTextarea rows="4" [(ngModel)]="form.description"></textarea>
    </div>

    <div class="grid">
      <div class="col-12 md:col-6">
        <div class="field">
          <label for="priority">Prioridad</label>
          <p-select id="priority" [options]="priorityOptions" [(ngModel)]="form.priority" optionLabel="label"
            optionValue="value" appendTo="body"></p-select>
        </div>
      </div>

      <div class="col-12 md:col-6">
        <div class="field">
          <label for="assignedTo">Asignado a</label>
          <p-select id="assignedTo" [options]="assignedOptions" [(ngModel)]="form.assignedTo" optionLabel="label"
            optionValue="value" placeholder="Selecciona un usuario" appendTo="body"></p-select>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="dueDate">Fecha límite</label>
      <p-datepicker id="dueDate" [(ngModel)]="form.dueDate" [showIcon]="true" [showButtonBar]="true"
        dateFormat="yy-mm-dd" appendTo="body" styleClass="w-full"></p-datepicker>
    </div>

    <div class="ticket-modal-actions">
      <button pButton type="button" label="Cancelar" severity="secondary" (click)="close()"></button>
      <button pButton type="button" label="Guardar" (click)="save()"></button>
    </div>
  </div>
</p-dialog>
