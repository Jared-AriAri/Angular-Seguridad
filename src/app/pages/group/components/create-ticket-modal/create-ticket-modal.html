<p-dialog
  header="Crear ticket"
  [(visible)]="visible"
  [modal]="true"
  [closable]="true"
  [style]="{ width: '640px', maxWidth: '96vw' }"
  (onHide)="close()"
>
  <div class="ticket-modal-form">
    <div class="field">
      <label for="title">Título</label>
      <input id="title" pInputText [(ngModel)]="form.title" />
    </div>

    <div class="field">
      <label for="description">Descripción</label>
      <textarea id="description" pTextarea rows="4" [(ngModel)]="form.description"></textarea>
    </div>

    <div class="grid">
      <div class="col-12 md:col-6">
        <div class="field">
          <label for="priority">Prioridad</label>
          <p-select
            id="priority"
            [options]="priorityOptions"
            [(ngModel)]="form.priority"
            optionLabel="label"
            optionValue="value"
          ></p-select>
        </div>
      </div>

      <div class="col-12 md:col-6">
        <div class="field">
          <label for="assignedTo">Asignado a</label>
          <p-select
            id="assignedTo"
            [options]="assignedOptions"
            [(ngModel)]="form.assignedTo"
            optionLabel="label"
            optionValue="value"
            placeholder="Selecciona un usuario"
          ></p-select>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="dueDate">Fecha límite</label>
      <input id="dueDate" pInputText [(ngModel)]="form.dueDate" placeholder="YYYY-MM-DD" />
    </div>

    <div class="ticket-modal-actions">
      <button pButton type="button" label="Cancelar" severity="secondary" (click)="close()"></button>
      <button pButton type="button" label="Guardar" (click)="save()"></button>
    </div>
  </div>
</p-dialog>
