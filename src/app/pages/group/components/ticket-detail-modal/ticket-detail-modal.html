<p-dialog [(visible)]="visible" [modal]="true" [style]="{width:'600px'}" (onHide)="close()">

  <ng-container *ngIf="editableTicket">

    <div class="p-fluid">

      <div class="field">
        <label>Título</label>
        <input
          pInputText
          [(ngModel)]="editableTicket.title"
          [disabled]="!canEditTicket"
        />
      </div>

      <div class="field">
        <label>Descripción</label>
        <textarea
          pTextarea
          rows="4"
          [(ngModel)]="editableTicket.description"
          [disabled]="!canEditTicket"
        ></textarea>
      </div>

      <div class="field">
        <label>Estado</label>
        <p-select
          [options]="statusOptions"
          [(ngModel)]="editableTicket.status"
          optionLabel="label"
          optionValue="value"
          [disabled]="!canEditTicket"
        ></p-select>
      </div>

      <div class="field">
        <label>Prioridad</label>
        <p-select
          [options]="priorityOptions"
          [(ngModel)]="editableTicket.priority"
          optionLabel="label"
          optionValue="value"
          [disabled]="!canEditTicket"
        ></p-select>
      </div>

      <div class="field">
        <label>Asignado a</label>
        <p-select
          [options]="assignedOptions"
          [(ngModel)]="editableTicket.assignedTo"
          optionLabel="label"
          optionValue="value"
          [disabled]="!canEditTicket"
        ></p-select>
      </div>

      <div class="field">
        <label>Fecha límite</label>
        <p-datepicker
          [(ngModel)]="editableTicket.dueDate"
          [disabled]="!canEditTicket"
        ></p-datepicker>
      </div>

    </div>

    <div class="p-mt-3">
      <label>Comentarios</label>

      <div *ngFor="let c of editableTicket.comments" class="p-mb-2">
        <p-tag severity="info" [value]="c.author"></p-tag>
        <span class="p-ml-2">{{ c.message }}</span>
      </div>

      <div class="p-inputgroup p-mt-2">
        <input
          pInputText
          [(ngModel)]="newComment"
          placeholder="Agregar comentario"
          [disabled]="!canEditTicket"
        />

        <button
          pButton
          icon="pi pi-send"
          (click)="addComment()"
          [disabled]="!canEditTicket"
        ></button>
      </div>
    </div>

  </ng-container>

  <ng-template pTemplate="footer">
    <button
      pButton
      label="Guardar"
      icon="pi pi-check"
      (click)="save()"
      [disabled]="!canEditTicket"
    ></button>

    <button
      pButton
      label="Cerrar"
      icon="pi pi-times"
      class="p-button-secondary"
      (click)="close()"
    ></button>
  </ng-template>

</p-dialog>
