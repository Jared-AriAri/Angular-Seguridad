<p-dialog header="Miembros del grupo" [(visible)]="visible" [modal]="true" [closable]="true" [dismissableMask]="true"
  [draggable]="false" [resizable]="false" [style]="{ width: '720px', maxWidth: '96vw' }" (onHide)="close()">
  <div class="group-members-wrap">
    <ng-container *ngIf="canViewGroupMembers; else noAccess">
      <div class="group-members-add" *ngIf="canManageGroupMembers">
        <p-select [options]="userOptions" [(ngModel)]="selectedUsername" optionLabel="label" optionValue="value"
          placeholder="Selecciona un usuario registrado" appendTo="body" [filter]="true" filterBy="label"
          styleClass="w-full"></p-select>

        <button pButton type="button" label="Añadir" [disabled]="!selectedUsername" (click)="addMember()"></button>
      </div>

      <div class="group-members-list" *ngIf="members.length; else emptyMembers">
        <div class="group-member-row" *ngFor="let member of members">
          <div>
            <div class="group-member-name">
              {{ member.fullName || member.username }}
            </div>
            <div class="group-member-email">{{ member.email }}</div>
          </div>

          <button *ngIf="canManageGroupMembers" pButton type="button" label="Eliminar" severity="danger"
            (click)="removeMember(member.username)"></button>
        </div>
      </div>

      <ng-template #emptyMembers>
        <div class="dashboard-empty-state">
          No hay miembros agregados en este grupo.
        </div>
      </ng-template>
    </ng-container>

    <ng-template #noAccess>
      <div class="dashboard-empty-state">
        No tienes permiso para ver los miembros de este grupo.
      </div>
    </ng-template>
  </div>
</p-dialog>
