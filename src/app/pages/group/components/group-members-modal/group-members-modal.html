<p-dialog [header]="canManageGroupMembers ? 'Gestionar Miembros' : 'Miembros del Grupo'" [(visible)]="visible"
  [modal]="true" [closable]="true" (onHide)="close()" [style]="{ width: '500px', maxWidth: '95vw' }">

  <div class="flex flex-column gap-4">
    <div *ngIf="canManageGroupMembers"
      class="flex flex-column gap-2 p-3 bg-gray-900 border-round border-1 border-gray-800">
      <label class="font-bold text-sm text-primary-400 uppercase">Asignar Nuevo Miembro</label>
      <div class="flex gap-2">
        <p-select [options]="userOptions" [(ngModel)]="selectedUserId" optionLabel="label" optionValue="value"
          placeholder="Seleccionar usuario..." [filter]="true" class="flex-grow-1">
        </p-select>
        <button pButton icon="pi pi-plus" class="p-button-success" (click)="addMember()" [disabled]="!selectedUserId">
        </button>
      </div>
    </div>

    <div>
      <div class="flex justify-content-between align-items-center mb-3">
        <span class="font-bold text-lg">Miembros Actuales</span>
        <p-tag [value]="members.length + ' usuarios'" severity="info"></p-tag>
      </div>

      <div class="flex flex-column gap-2" style="max-height: 400px; overflow-y: auto;">
        <div *ngFor="let member of members"
          class="flex justify-content-between align-items-center p-3 bg-gray-900 border-round border-1 border-gray-800">
          <div class="flex flex-column">
            <span class="font-bold text-white">{{ member.display_name }}</span>
            <span class="text-xs opacity-60">{{ member.display_email }}</span>
            <span class="text-xs mt-1 opacity-40 italic">
              Unido: {{ (member.fecha_unido || member.creado_en) | date: 'short' }}
            </span>
          </div>

          <button *ngIf="canManageGroupMembers" pButton icon="pi pi-user-minus"
            class="p-button-rounded p-button-text p-button-danger" (click)="removeMember(member.usuario_id)"
            pTooltip="Remover del grupo">
          </button>
        </div>

        <div *ngIf="members.length === 0"
          class="text-center p-5 opacity-50 border-round border-1 border-dashed border-gray-700">
          <i class="pi pi-users text-4xl mb-2"></i>
          <p>No hay miembros en este grupo</p>
        </div>
      </div>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-content-between align-items-center w-full">
      <div *ngIf="!canManageGroupMembers" class="text-left text-xs opacity-50 italic">
        <i class="pi pi-info-circle mr-1"></i>
        Solo lectura
      </div>
      <button pButton label="Cerrar" class="p-button-text ml-auto" (click)="close()"></button>
    </div>
  </ng-template>
</p-dialog>
