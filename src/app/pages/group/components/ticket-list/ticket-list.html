<p-table #dt [value]="tickets" responsiveLayout="scroll" styleClass="ticket-table" 
  [paginator]="true" [rows]="10"
  [globalFilterFields]="['title', 'assignedTo', 'status', 'priority']"
  selectionMode="single" (onRowSelect)="onRowSelect($event)">
  
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="title">Título <p-sortIcon field="title"></p-sortIcon></th>
      <th pSortableColumn="status">Estado <p-sortIcon field="status"></p-sortIcon></th>
      <th pSortableColumn="priority">Prioridad <p-sortIcon field="priority"></p-sortIcon></th>
      <th pSortableColumn="assignedTo">Asignado <p-sortIcon field="assignedTo"></p-sortIcon></th>
      <th pSortableColumn="createdAt">Creación <p-sortIcon field="createdAt"></p-sortIcon></th>
      <th pSortableColumn="dueDate">Fecha límite <p-sortIcon field="dueDate"></p-sortIcon></th>
    </tr>
    <tr>
      <th>
        <p-columnFilter type="text" field="title" matchMode="contains" [showMenu]="false"></p-columnFilter>
      </th>
      <th>
        <p-columnFilter field="status" matchMode="equals" [showMenu]="false">
          <ng-template pTemplate="filter" let-value let-filter="filterCallback">
            <p-select [ngModel]="value" [options]="statusOptions" optionLabel="label" optionValue="value" (onChange)="filter($event.value)" appendTo="body" styleClass="p-fluid"></p-select>
          </ng-template>
        </p-columnFilter>
      </th>
      <th>
        <p-columnFilter type="text" field="priority" matchMode="contains" [showMenu]="false"></p-columnFilter>
      </th>
      <th>
        <p-columnFilter type="text" field="assignedTo" matchMode="contains" [showMenu]="false"></p-columnFilter>
      </th>
      <th></th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-ticket>
    <tr [pSelectableRow]="ticket">
      <td>{{ ticket.title }}</td>
      <td>{{ ticket.status }}</td>
      <td><p-tag [value]="ticket.priority"></p-tag></td>
      <td>{{ ticket.assignedTo || 'Sin asignar' }}</td>
      <td>{{ ticket.createdAt | date:'shortDate' }}</td>
      <td>{{ ticket.dueDate || 'Sin fecha' }}</td>
    </tr>
  </ng-template>
</p-table>
