<p-table [value]="tickets" responsiveLayout="scroll" styleClass="ticket-table">
  <ng-template pTemplate="header">
    <tr>
      <th>Título</th>
      <th>Estado</th>
      <th>Prioridad</th>
      <th>Asignado</th>
      <th>Creación</th>
      <th>Fecha límite</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-ticket>
    <tr>
      <td>{{ ticket.title }}</td>
      <td>{{ ticket.status }}</td>
      <td><p-tag [value]="ticket.priority"></p-tag></td>
      <td>{{ ticket.assignedTo }}</td>
      <td>{{ ticket.createdAt }}</td>
      <td>{{ ticket.dueDate || 'Sin fecha' }}</td>
    </tr>
  </ng-template>
</p-table>
