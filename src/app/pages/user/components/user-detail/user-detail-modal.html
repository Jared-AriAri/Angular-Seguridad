<p-dialog [(visible)]="visible" [modal]="true" [draggable]="false" [resizable]="false" [appendTo]="'body'"
    [style]="{ width: '600px', maxWidth: '95vw' }" header="Detalles del Perfil" (onHide)="onHide()">

    <div class="auth-body" *ngIf="user">
        <div class="flex flex-column align-items-center mb-4 pb-4 border-bottom-1 border-gray-800">
            <div class="bg-primary-900 border-round-circle flex align-items-center justify-content-center mb-3"
                style="width: 80px; height: 80px">
                <i class="pi pi-user text-4xl text-primary-200"></i>
            </div>
            <div class="text-2xl font-bold text-white">{{ user.nombre_completo }}</div>
            <div class="text-primary-400 font-medium">@{{ user.username }}</div>
        </div>

        <div class="grid p-fluid">
            <div class="col-12 md:col-6 mb-3">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Correo Electrónico</label>
                <div
                    class="p-3 bg-gray-900 border-round border-1 border-gray-800 flex align-items-center gap-2 text-white">
                    <i class="pi pi-envelope text-primary-400"></i>
                    <span>{{ user.email }}</span>
                </div>
            </div>

            <div class="col-12 md:col-6 mb-3">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Teléfono</label>
                <div
                    class="p-3 bg-gray-900 border-round border-1 border-gray-800 flex align-items-center gap-2 text-white">
                    <i class="pi pi-phone text-primary-400"></i>
                    <span>{{ user.telefono || 'Sin registrar' }}</span>
                </div>
            </div>

            <div class="col-12 md:col-6 mb-3">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Fecha de Nacimiento</label>
                <div
                    class="p-3 bg-gray-900 border-round border-1 border-gray-800 flex align-items-center gap-2 text-white">
                    <i class="pi pi-calendar text-primary-400"></i>
                    <span>{{ user.fecha_nacimiento || 'N/A' }}</span>
                </div>
            </div>

            <div class="col-12 md:col-6 mb-3">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">ID de Sistema</label>
                <div
                    class="p-3 bg-gray-900 border-round border-1 border-gray-800 flex align-items-center gap-2 text-white">
                    <i class="pi pi-id-card text-primary-400"></i>
                    <span class="text-xs">{{ user.id }}</span>
                </div>
            </div>

            <div class="col-12 mb-3">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Dirección</label>
                <div
                    class="p-3 bg-gray-900 border-round border-1 border-gray-800 flex align-items-center gap-2 text-white">
                    <i class="pi pi-map-marker text-primary-400"></i>
                    <span>{{ user.direccion || 'No especificada' }}</span>
                </div>
            </div>

            <div class="col-12 mt-2">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Permisos Globales Activos</label>
                <div class="flex flex-wrap gap-2 p-3 bg-gray-900 border-round border-1 border-gray-800">
                    <p-tag *ngFor="let perm of (user.permisos_globales || user.permissions || [])" [value]="perm"
                        severity="secondary" styleClass="text-xs"></p-tag>
                    <div *ngIf="!(user.permisos_globales || user.permissions)?.length"
                        class="text-sm italic opacity-50">
                        El usuario no tiene permisos asignados.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <ng-template pTemplate="footer">
        <button pButton label="Cerrar" icon="pi pi-times" class="p-button-text" (click)="onHide()"></button>
    </ng-template>
</p-dialog>
