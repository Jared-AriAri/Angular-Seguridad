<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<p-card styleClass="auth-card auth-card--premium" [style]="{ width: '1000px', maxWidth: '96vw' }">
  <ng-template pTemplate="header">
    <div class="auth-head">
      <div class="auth-title">Gestión de Usuarios</div>
      <div class="auth-subtitle">Administra cuentas, perfiles y permisos globales del sistema</div>
    </div>
  </ng-template>

  <div class="auth-body">
    <p-toolbar styleClass="mb-4">
      <ng-template pTemplate="start">
        <div class="flex gap-2">
          <button *ngIf="hasPermission('user:create')" pButton type="button" icon="pi pi-plus" label="Nuevo Usuario"
            class="p-button-success" (click)="openCreate()"></button>
          <button pButton type="button" icon="pi pi-refresh" class="p-button-text p-button-secondary"
            (click)="refresh()"></button>
        </div>
      </ng-template>

      <ng-template pTemplate="end">
        <span class="p-input-icon-left w-full auth-input" style="max-width: 350px;">
          <i class="pi pi-search"></i>
          <input pInputText type="text" class="w-full" [(ngModel)]="q"
            placeholder="Buscar por nombre, usuario o email..." />
        </span>
      </ng-template>
    </p-toolbar>

    <div class="mt-2">
      <p-table [value]="filteredUsers" [loading]="loading" [paginator]="true" [rows]="10"
        styleClass="p-datatable-sm p-datatable-striped">
        <ng-template pTemplate="header">
          <tr>
            <th>Usuario</th>
            <th>Nombre Completo</th>
            <th>Email</th>
            <th style="text-align: center;">Permisos</th>
            <th style="text-align: right;">Acciones</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-u>
          <tr>
            <td>
              <div class="font-bold" style="color: var(--primary-color);">{{ u.username }}</div>
              <div class="text-xs opacity-50">ID: {{ u.id.substring(0,8) }}</div>
            </td>
            <td>{{ u.nombre_completo }}</td>
            <td>{{ u.email }}</td>
            <td style="text-align: center;">
              <p-tag [value]="u.permisos_globales?.length || 0"
                [severity]="(u.permisos_globales?.length || 0) > 0 ? 'success' : 'secondary'" [rounded]="true"></p-tag>
            </td>

            <td style="text-align: right; white-space: nowrap;">
              <button *ngIf="hasPermission('user:permissions:edit')" pButton type="button" icon="pi pi-key"
                class="p-button-text p-button-warning" (click)="openPermissions(u)" pTooltip="Permisos"></button>

              <button *ngIf="hasPermission('user:view')" pButton type="button" icon="pi pi-eye"
                class="p-button-text p-button-info" (click)="openView(u)" pTooltip="Ver Detalle"></button>

              <button *ngIf="hasPermission('user:edit')" pButton type="button" icon="pi pi-pencil" class="p-button-text"
                (click)="openEdit(u)" pTooltip="Editar"></button>

              <button *ngIf="hasPermission('user:delete')" pButton type="button" icon="pi pi-trash"
                class="p-button-text p-button-danger" (click)="askDelete(u)" pTooltip="Eliminar"></button>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</p-card>

<p-dialog [(visible)]="dialogOpen" [modal]="true" [draggable]="false" [resizable]="false" [appendTo]="'body'"
  [style]="{ width: '750px', maxWidth: '95vw' }" [header]="form.id ? 'Modificar Usuario' : 'Registrar Nuevo Usuario'">
  <div class="p-fluid grid mt-2">
    <div class="field col-12 md:col-6">
      <label class="font-bold">Nombre de Usuario</label>
      <input pInputText [(ngModel)]="form.username" [disabled]="!!form.id" />
    </div>
    <div class="field col-12 md:col-6">
      <label class="font-bold">Correo Electrónico</label>
      <input pInputText [(ngModel)]="form.email" [disabled]="!!form.id" />
    </div>
    <div class="field col-12">
      <label class="font-bold">Nombre Completo</label>
      <input pInputText [(ngModel)]="form.nombre_completo" />
    </div>
    <div class="field col-12 md:col-6">
      <label class="font-bold">Teléfono</label>
      <input pInputText [(ngModel)]="form.telefono" />
    </div>
    <div class="field col-12 md:col-6">
      <label class="font-bold">Fecha de Nacimiento</label>
      <input pInputText type="date" [(ngModel)]="form.fecha_nacimiento" />
    </div>
    <div class="field col-12">
      <label class="font-bold">Dirección</label>
      <input pInputText [(ngModel)]="form.direccion" />
    </div>
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" class="p-button-text" label="Cancelar" (click)="dialogOpen = false"></button>
    <button pButton type="button" icon="pi pi-save" label="Guardar" (click)="save()"></button>
  </ng-template>
</p-dialog>

<p-dialog [(visible)]="permissionsOpen" [modal]="true" [draggable]="false" [appendTo]="'body'"
  [header]="'Permisos Globales: ' + selectedUser?.username" [style]="{ width: '650px' }">
  <div class="p-fluid">
    <div class="grid">
      <div *ngFor="let perm of allPermissionsList" class="col-12 md:col-6 mb-3">
        <div class="flex align-items-center p-2 border-round hover:surface-hover">
          <p-checkbox [value]="perm" [(ngModel)]="userPermissions" [inputId]="perm"></p-checkbox>
          <label [for]="perm" class="ml-2 cursor-pointer w-full font-medium text-white">{{ perm }}</label>
        </div>
      </div>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <button pButton label="Cancelar" class="p-button-text" (click)="permissionsOpen = false"></button>
    <button pButton label="Actualizar" icon="pi pi-lock-open" class="p-button-success"
      (click)="savePermissions()"></button>
  </ng-template>
</p-dialog>

<app-user-detail-modal [visible]="viewOpen" [user]="selectedUser" (closeModal)="viewOpen = false">
</app-user-detail-modal>
