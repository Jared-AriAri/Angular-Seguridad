<div class="home-dashboard-container">
  <div class="home-dashboard">
    <p-card styleClass="home-dashboard-card shadow-8">

      <div class="dashboard-hero">
        <div class="dashboard-hero__left">
          <h1 (click)="logoClicked()" class="logo-title">ERPJir</h1>
          <div class="dashboard-hero__meta">
            <div class="dashboard-version-pill">
              <span>Versión</span>
              <strong>{{ version }}</strong>
            </div>
            <div class="llm-badge">
              <span class="llm-badge__label">LLM:</span>
              <span class="llm-badge__value">{{ llmModel }}</span>
            </div>
          </div>
        </div>

        <div class="dashboard-hero__right" *ngIf="groups && groups.length > 0">
          <div class="flex flex-column gap-1">
            <label class="text-white-alpha-70 text-sm font-medium">Workspace Activo</label>
            <p-select [options]="groups" [(ngModel)]="selectedGroup" optionLabel="nombre" (onChange)="onGroupChange()"
              styleClass="w-full md:w-20rem shadow-2">
            </p-select>
          </div>
        </div>
      </div>

      <p-divider></p-divider>
      <div class="dashboard-kpi-grid mt-4" *ngIf="hasPermission('ticket:view')">
        <div class="dashboard-stat-card" (click)="goToKanban()">
          <div class="dashboard-stat-top">
            <span class="dashboard-stat-label">Total Tickets</span>
            <i class="pi pi-ticket dashboard-stat-icon"></i>
          </div>
          <div class="dashboard-stat-value">{{ stats.total }}</div>
        </div>

        <div class="dashboard-stat-card dashboard-stat-card--danger" (click)="goToKanban()">
          <div class="dashboard-stat-top">
            <span class="dashboard-stat-label">Pendientes</span>
            <i class="pi pi-clock dashboard-stat-icon"></i>
          </div>
          <div class="dashboard-stat-value text-orange-500">{{ stats.pendientes }}</div>
        </div>

        <div class="dashboard-stat-card" (click)="goToKanban()">
          <div class="dashboard-stat-top">
            <span class="dashboard-stat-label">Finalizados</span>
            <i class="pi pi-check-circle dashboard-stat-icon"></i>
          </div>
          <div class="dashboard-stat-value text-green-500">{{ stats.finalizados }}</div>
        </div>
      </div>

      <div class="dashboard-main-grid mt-4">
        <div class="dashboard-left-column">

          <div class="dashboard-section-card" *ngIf="hasPermission('ticket:view')">
            <h2 class="dashboard-section-title">Distribución por Estado</h2>
            <div class="dashboard-chart-wrap mt-3">
              <p-chart type="bar" [data]="chartData" [options]="chartOptions" height="250px"></p-chart>
            </div>
          </div>

          <div class="dashboard-section-card mt-3" *ngIf="hasPermission('ticket:view')">
            <div class="dashboard-section-head">
              <h2 class="dashboard-section-title">Tickets Recientes</h2>
              <div class="dashboard-filters">
                <button pButton label="Todos" class="p-button-sm p-button-outlined"
                  [ngClass]="{'p-button-primary': activeQuickFilter === 'all'}"
                  (click)="applyQuickFilter('all')"></button>
                <button pButton label="Míos" class="p-button-sm p-button-outlined"
                  [ngClass]="{'p-button-primary': activeQuickFilter === 'mine'}"
                  (click)="applyQuickFilter('mine')"></button>
              </div>
            </div>

            <p-table [value]="filteredRecentTickets" [rows]="5" styleClass="p-datatable-sm">
              <ng-template pTemplate="header">
                <tr>
                  <th>Título</th>
                  <th>Estado</th>
                  <th style="width: 50px"></th>
                </tr>
              </ng-template>

              <ng-template pTemplate="body" let-ticket>
                <tr>
                  <td class="font-bold text-white">{{ ticket.titulo }}</td>
                  <td>
                    <p-tag [value]="getTicketStatusLabel(ticket)" [severity]="getTicketStatusSeverity(ticket)"></p-tag>
                  </td>
                  <td>
                    <button pButton icon="pi pi-eye" class="p-button-rounded p-button-text"
                      (click)="viewTicket(ticket)"></button>
                  </td>
                </tr>
              </ng-template>

              <ng-template pTemplate="emptymessage">
                <tr>
                  <td colspan="3" class="text-center p-4 text-white-alpha-50">
                    No hay tickets para mostrar
                  </td>
                </tr>
              </ng-template>
            </p-table>
          </div>
        </div>

        <div class="dashboard-right-column">
          <div class="dashboard-section-card">
            <h2 class="dashboard-section-title">Gestión</h2>
            <div class="dashboard-actions mt-3">
              <button pButton label="Ir al Kanban" icon="pi pi-th-large" class="w-full p-button-primary"
                (click)="goToKanban()"></button>

              <button *ngIf="hasPermission('ticket:create')" pButton label="Nuevo Ticket" icon="pi pi-plus"
                class="p-button-success w-full" (click)="openCreateTicket()"></button>

              <p-divider align="left"><span class="text-sm text-white-alpha-50">Admin</span></p-divider>

              <button *ngIf="hasPermission('user:view')" pButton label="Usuarios" icon="pi pi-users"
                class="p-button-outlined w-full" [routerLink]="['/app/user']"></button>

              <button *ngIf="hasPermission('group:edit')" pButton label="Grupos" icon="pi pi-database"
                class="p-button-outlined w-full" [routerLink]="['/app/group']"></button>
            </div>
          </div>
        </div>

      </div>
    </p-card>
  </div>
</div>

<app-create-ticket-modal *ngIf="showCreateModal && selectedGroup" [visible]="showCreateModal"
  [groupId]="selectedGroup.id" (closeModal)="showCreateModal = false" (ticketCreated)="loadTickets()">
</app-create-ticket-modal>

<app-ticket-detail-modal *ngIf="showDetailModal" [visible]="showDetailModal" [ticket]="selectedTicket"
  (closeModal)="onDetailClose()">
</app-ticket-detail-modal>
