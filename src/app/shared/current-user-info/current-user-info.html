<button
  *ngIf="currentUser"
  pButton
  type="button"
  label="Mi perfil"
  icon="pi pi-user"
  class="p-button-outlined w-full"
  (click)="open()"
></button>

<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '720px', maxWidth: '95vw' }"
  header="Mi perfil"
  (onHide)="close()"
>
  <div *ngIf="currentUser" class="p-fluid">
    <div class="field">
      <label style="opacity: 0.7;">Nombre completo</label>
      <div style="font-weight: 800;">{{ currentUser.fullName }}</div>
    </div>

    <div class="field" style="margin-top: 10px;">
      <label style="opacity: 0.7;">Usuario</label>
      <div style="font-weight: 700;">{{ currentUser.username }}</div>
    </div>

    <div class="field" style="margin-top: 10px;">
      <label style="opacity: 0.7;">Email</label>
      <div style="font-weight: 700;">{{ currentUser.email }}</div>
    </div>

    <div class="field" style="margin-top: 10px;">
      <label style="opacity: 0.7;">Teléfono</label>
      <div style="font-weight: 700;">{{ currentUser.phone || "—" }}</div>
    </div>

    <div class="field" style="margin-top: 10px;">
      <label style="opacity: 0.7;">Dirección</label>
      <div style="font-weight: 700;">{{ currentUser.address || "—" }}</div>
    </div>

    <div class="field" style="margin-top: 10px;">
      <label style="opacity: 0.7;">Nacimiento</label>
      <div style="font-weight: 700;">{{ currentUser.birthDate || "—" }}</div>
    </div>

    <div class="field" style="margin-top: 10px;">
      <label style="opacity: 0.7;">Permisos</label>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <p-tag
          *ngFor="let permission of currentUser.permissions"
          [value]="permission"
          severity="info"
        ></p-tag>
      </div>
    </div>

    <div class="field" style="margin-top: 10px;">
      <label style="opacity: 0.7;">Creado</label>
      <div style="font-weight: 700;">{{ currentUser.createdAt | date: "medium" }}</div>
    </div>
  </div>
</p-dialog>
